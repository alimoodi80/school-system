function eField(label, inner) { return `<div class="field" style="margin-bottom:10px"><label>${label}</label>${inner}</div>`; }
function eInput(id, value, extra = "") { return `<input id="${id}" value="${(value == null ? "" : String(value)).replace(/"/g, "&quot;")}" ${extra}>`; }
function eTextarea(id, value) { return `<textarea id="${id}" rows="3">${value == null ? "" : String(value)}</textarea>`; }
function isoToJalaliParts(iso) { if (!iso) return { jy: "", jm: "", jd: "" }; const p = String(iso).slice(0, 10).split("-").map(Number); return toJalaali(p[0], p[1], p[2]); }
function faDate(iso) {
  if (!iso) return "—";
  try { return new Date(iso + (iso.length === 10 ? "T00:00:00" : "")).toLocaleDateString("fa-IR"); } catch { return iso; }
}
function todayISO() { return new Date().toISOString().slice(0, 10); }
function jdiv(a, b) { return ~~(a / b); }
function jmod(a, b) { return a - ~~(a / b) * b; }
function g2d(gy, gm, gd) { const d = jdiv((gy + jdiv(gm - 8, 6) + 100100) * 1461, 4) + jdiv(153 * jmod(gm + 9, 12) + 2, 5) + gd - 34840408; return d - jdiv(jdiv(gy + 100100 + jdiv(gm - 8, 6), 100) * 3, 4) + 752; }
function d2g(jdn) {
  let j = 4 * jdn + 139361631;
  j = j + jdiv(jdiv(4 * jdn + 183187720, 146097) * 3, 4) * 4 - 3908;
  const i = jdiv(jmod(j, 1461), 4) * 5 + 308;
  const gd = jdiv(jmod(i, 153), 5) + 1;
  const gm = jmod(jdiv(i, 153), 12) + 1;
  const gy = jdiv(j, 1461) - 100100 + jdiv(8 - gm, 6);
  return { gy, gm, gd };
}
function jalCal(jy) {
  const breaks = [-61, 9, 38, 199, 426, 686, 756, 818, 1111, 1181, 1210, 1635, 2060, 2097, 2192, 2262, 2324, 2394, 2456, 3178];
  let gy = jy + 621, leapJ = -14, jp = breaks[0], jm = 0, jump = 0;
  for (let i = 1; i < breaks.length; i++) { jm = breaks[i]; jump = jm - jp; if (jy < jm) break; leapJ += jdiv(jump, 33) * 8 + jdiv(jmod(jump, 33), 4); jp = jm; }
  let n = jy - jp;
  leapJ += jdiv(n, 33) * 8 + jdiv(jmod(n, 33) + 3, 4);
  if (jmod(jump, 33) === 4 && jump - n === 4) leapJ += 1;
  const leapG = jdiv(gy, 4) - jdiv((jdiv(gy, 100) + 1) * 3, 4) - 150;
  const march = 20 + leapJ - leapG;
  if (jump - n < 6) n = n - jump + jdiv(jump + 4, 33) * 33;
  let leap = jmod(jmod(n + 1, 33) - 1, 4); if (leap === -1) leap = 4;
  return { leap, gy, march };
}
function j2d(jy, jm, jd) { const r = jalCal(jy); return g2d(r.gy, 3, r.march) + (jm - 1) * 31 - jdiv(jm, 7) * (jm - 7) + jd - 1; }
function d2j(jdn) {
  const gy = d2g(jdn).gy; let jy = gy - 621; const r = jalCal(jy); const jdn1f = g2d(gy, 3, r.march);
  let k = jdn - jdn1f, jm, jd;
  if (k >= 0) { if (k <= 185) { return { jy, jm: 1 + jdiv(k, 31), jd: jmod(k, 31) + 1 }; } k -= 186; }
  else { jy -= 1; k += 179; if (r.leap === 1) k += 1; }
  jm = 7 + jdiv(k, 30); jd = jmod(k, 30) + 1; return { jy, jm, jd };
}
function toJalaali(gy, gm, gd) { return d2j(g2d(gy, gm, gd)); }
function toGregorian(jy, jm, jd) { return d2g(j2d(jy, jm, jd)); }
function todayJalaali() { const t = new Date(); return toJalaali(t.getFullYear(), t.getMonth() + 1, t.getDate()); }
function normDigits(s) { return String(s == null ? "" : s).replace(/[۰-۹]/g, c => "۰۱۲۳۴۵۶۷۸۹".indexOf(c)).replace(/[٠-٩]/g, c => "٠١٢٣٤٥٦٧٨٩".indexOf(c)); }
function jalaliToISO(jy, jm, jd) {
  jy = +normDigits(jy); jm = +normDigits(jm); jd = +normDigits(jd);
  if (!jy || !jm || !jd || jm < 1 || jm > 12 || jd < 1 || jd > 31) return null;
  const g = toGregorian(jy, jm, jd);
  return g.gy + "-" + String(g.gm).padStart(2, "0") + "-" + String(g.gd).padStart(2, "0");
}
function jalaliFields(prefix, j) {
  return `<span style="display:inline-flex;gap:5px;align-items:center"><input id="${prefix}D" type="text" inputmode="numeric" value="${j.jd}" placeholder="روز" style="width:56px;padding:8px;border:1px solid #cbd5e1;border-radius:8px"><span>/</span><input id="${prefix}M" type="text" inputmode="numeric" value="${j.jm}" placeholder="ماه" style="width:56px;padding:8px;border:1px solid #cbd5e1;border-radius:8px"><span>/</span><input id="${prefix}Y" type="text" inputmode="numeric" value="${j.jy}" placeholder="سال" style="width:76px;padding:8px;border:1px solid #cbd5e1;border-radius:8px"></span>`;
}
function readJalali(prefix) { return jalaliToISO(val(prefix + "Y"), val(prefix + "M"), val(prefix + "D")); }

async function api(path, opts = {}) {
  const { headers: extraHeaders, ...rest } = opts;
  const res = await fetch(API + path, { ...rest, headers: { ...HEADERS, ...(extraHeaders || {}) } });
  if (!res.ok) { const txt = await res.text(); throw new Error(txt || ("HTTP " + res.status)); }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}
const SCOPED_TABLES = ["classes", "students", "staff", "attendance", "sms_log", "announcements", "homework", "profiles", "class_subjects", "academic_years", "grades", "discipline_types", "discipline_records", "delegations"];
function scopeRead(path) {
  if (session && session.school_id && !path.includes("school_id=")) {
    const mm = path.match(/^\/([a-z_]+)(\?|$)/);
    if (mm && SCOPED_TABLES.includes(mm[1])) path += (path.includes("?") ? "&" : "?") + "school_id=eq." + session.school_id;
  }
  return path;
}
function scopeWrite(path, body) {
  if (session && session.school_id && body && typeof body === "object" && !Array.isArray(body)) {
    const mm = path.match(/^\/([a-z_]+)$/);
    if (mm && SCOPED_TABLES.includes(mm[1]) && body.school_id === undefined) return { ...body, school_id: session.school_id };
  }
  return body;
}
const get = (path) => api(scopeRead(path));
const post = (path, body, prefer = "return=representation") => api(path, { method: "POST", body: JSON.stringify(scopeWrite(path, body)), headers: { "Prefer": prefer } });
const upsert = (path, body) => api(path, { method: "POST", body: JSON.stringify(body), headers: { "Prefer": "resolution=merge-duplicates,return=representation" } });

async function enterApp() {
  document.getElementById("loginView").classList.add("hidden");
  document.getElementById("appView").classList.remove("hidden");
  if (session.school_id && !session.school_name) {
    const sc = await get("/schools?select=name&id=eq." + session.school_id).catch(() => null);
    if (sc && sc.length) { session.school_name = sc[0].name; localStorage.setItem("school_session", JSON.stringify(session)); }
  }
  document.getElementById("whoAmI").textContent = session.full_name + " — " + (ROLE_FA[session.role] || session.role) + (session.school_name ? " — " + session.school_name : "");
  if (session.role !== "manager" && session.id) {
    const dg = await get("/delegations?select=permission&profile_id=eq." + session.id).catch(() => []);

  visibleTabs.forEach(t => {
    const b = document.createElement("button");
    b.textContent = t.label; b.dataset.tab = t.id;
    b.addEventListener("click", () => { currentTab = t.id; render(); });

  });

  currentTab = visibleTabs.some(t => t.id === "dashboard") ? "dashboard" : (visibleTabs.length ? visibleTabs[0].id : "dashboard");

}
async function refreshCache() {
  const [classes, students, staff, subjects, years, discTypes] = await Promise.all([
    get("/classes?select=*&order=grade").catch(() => []),
    get("/students?select=*&order=last_name").catch(() => []),
    get("/staff?select=*").catch(() => []),
    get("/class_subjects?select=*&order=subject_name").catch(() => []),
    get("/academic_years?select=*&order=created_at").catch(() => []),
    get("/discipline_types?select=*&order=title").catch(() => [])
  ]);
  cache = { classes: classes || [], students: students || [], staff: staff || [], subjects: subjects || [], years: years || [], discTypes: discTypes || [] };
}
function className(id) { const c = cache.classes.find(c => c.id === id); return c ? c.name : "—"; }
function studentName(id) { const s = cache.students.find(s => s.id === id); return s ? (s.first_name + " " + s.last_name) : "—"; }
function subjectName(id) { const s = (cache.subjects || []).find(x => x.id === id); return s ? s.subject_name : "—"; }
function staffNameOf(id) { const s = cache.staff.find(x => x.id === id); return s ? s.full_name : "—"; }
function yearName(id) { const y = (cache.years || []).find(x => x.id === id); return y ? y.name : "—"; }
function can(tab) { return session.role === "manager" || (session.perms || []).includes(tab); }
function currentYear() { return (cache.years || []).find(y => y.is_current) || null; }
function mySubjectIds() {
  if (session.role !== "teacher" || !session.staff_id) return null;
  const mine = (cache.subjects || []).filter(s => s.teacher_id === session.staff_id);
  return mine.length ? mine : null;
}
function myClasses() {
  const mine = mySubjectIds();
  if (!mine) return cache.classes;
  const ids = new Set(mine.map(s => s.class_id));
  const list = cache.classes.filter(c => ids.has(c.id));
  return list.length ? list : cache.classes;
}

function render() {
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === currentTab));
  const m = document.getElementById("main");
  if (currentTab === "dashboard") return viewDashboard(m);

  if (currentTab === "myattendance") return viewMyAttendance(m);
  if (currentTab === "students") return viewStudents(m);
  if (currentTab === "classes") return viewClasses(m);

  if (currentTab === "accounts") return viewAccounts(m);
  if (currentTab === "sms") return viewSms(m);

}

async function loadAttRecent() {
  const box = document.getElementById("attRecent");
  if (!box) return;
  const rows = await get("/attendance?select=*&order=attendance_date.desc,created_at.desc&limit=400").catch(() => []);
  if (!rows || !rows.length) { box.innerHTML = '<p class="muted">هنوز ثبتی انجام نشده است.</p>'; return; }
  const STA = { present: "حاضر", absent: "غایب", late: "تأخیر", excused: "غیبت موجه" };
  const groups = new Map();
  rows.forEach(r => {
    const key = [r.attendance_date, r.class_id, r.subject_id || "", r.period || ""].join("|");
    if (!groups.has(key)) groups.set(key, { date: r.attendance_date, class_id: r.class_id, subject_id: r.subject_id, period: r.period, recorded_by: r.recorded_by, ids: [], counts: { present: 0, absent: 0, late: 0, excused: 0 }, flagged: [] });
    const g = groups.get(key);
    g.ids.push(r.id);
    if (g.counts[r.status] != null) g.counts[r.status]++;
    if (r.status !== "present") g.flagged.push(r);
    if (!g.recorded_by) g.recorded_by = r.recorded_by;
  });
  const list = [...groups.values()].slice(0, 20);
  box.innerHTML = `<table><thead><tr><th>تاریخ</th><th>کلاس</th><th>درس</th><th>زنگ</th><th>خلاصه</th><th>غایب / تأخیر / موجه</th><th>ثبت‌کننده</th>${session.role === "deputy" ? "" : "<th>عملیات</th>"}</tr></thead><tbody>
    ${list.map((g, gi) => `<tr>
      <td>${faDate(g.date)}</td>
      <td>${className(g.class_id)}</td>
      <td>${g.subject_id ? subjectName(g.subject_id) : "بدون درس"}</td>

      <td>${g.flagged.length ? g.flagged.map(r => `${studentName(r.student_id)} (${STA[r.status]}) <button type="button" class="btn small secondary" data-gdisc="${gi}:${r.student_id}">ثبت مورد</button>`).join("<br>") : "—"}</td>
      <td>${g.recorded_by || "—"}</td>
      ${session.role === "deputy" ? "" : `<td><button class="btn small secondary" data-del-group="${gi}">حذف گروه</button></td>`}
    </tr>`).join("")}
    </tbody></table>`;
  box.querySelectorAll("[data-del-group]").forEach(btn => btn.addEventListener("click", async () => {
    const g = list[parseInt(btn.dataset.delGroup, 10)];
    if (!g) return;
    if (!(await askConfirm("همه رکوردهای این کلاس در این تاریخ و زنگ حذف شود؟"))) return;
    try { await api("/attendance?id=in.(" + g.ids.join(",") + ")", { method: "DELETE" }); toast("حذف شد"); loadAttRecent(); }
    catch { toast("خطا در حذف"); }
  }));
  box.querySelectorAll("[data-gdisc]").forEach(btn => btn.addEventListener("click", () => {
    const parts = btn.dataset.gdisc.split(":");
    const g = list[parseInt(parts[0], 10)];
    const stu = cache.students.find(x => x.id === parts[1]);
    if (!g || !stu) return;
    if (!(cache.discTypes || []).length) { toast("مدیر هنوز موردی در لیست انضباطی تعریف نکرده است"); return; }
    openEdit("ثبت مورد انضباطی — " + stu.first_name + " " + stu.last_name,
      eField("مورد", `<select id="dType">${(cache.discTypes || []).map(t => `<option value="${t.title}">${t.title}</option>`).join("")}</select>`) +
      eField("توضیحات", eInput("dDesc", "")),
      async () => {
        try {
          await post("/discipline_records", { class_id: g.class_id, student_id: stu.id, subject_id: g.subject_id || null, record_date: g.date, type_title: val("dType"), description: val("dDesc") || null, recorded_by: session.username });
          toast("مورد انضباطی ثبت شد");
        } catch { toast("خطا در ثبت"); return false; }
      });
  }));
}

async function runReport() {
  const type = document.getElementById("rpType").value;

  const box = document.getElementById("rpBody");
  if (!from || !to) { box.innerHTML = '<p class="muted">بازه تاریخ را درست وارد کنید.</p>'; return; }
  box.innerHTML = '<p class="muted">در حال بارگذاری…</p>';
  let subs = cache.subjects || [];
  if (classId) subs = subs.filter(s => s.class_id === classId);
  if (teacherId) subs = subs.filter(s => s.teacher_id === teacherId);
  const subIds = new Set(subs.map(s => s.id));
  const STA = { present: "حاضر", absent: "غایب", late: "تأخیر", excused: "غیبت موجه" };

        </tbody></table>` : '<p class="muted">نمره‌ای پیدا نشد.</p>';
    } else {

async function exportKarnameh() {
  const tid = document.getElementById("kxTeacher").value;
  const kxTerm = document.getElementById("kxTerm").value;
  const msg = document.getElementById("kxMsg");
  if (!tid) { msg.innerHTML = '<p class="muted">دبیری انتخاب نشده است.</p>'; return; }
  msg.innerHTML = '<p class="muted">در حال ساخت فایل…</p>';
  try {
    await loadXLSX();
    const subs = (cache.subjects || []).filter(s => s.teacher_id === tid);
    if (!subs.length) { msg.innerHTML = '<p class="muted">این دبیر درسی ندارد.</p>'; return; }
    const grades = await get("/grades?select=*&subject_id=in.(" + subs.map(s => s.id).join(",") + ")&term=eq." + encodeURIComponent(kxTerm)).catch(() => []);
    const gmap = {};
    (grades || []).forEach(g => { gmap[g.student_id + "|" + g.subject_id] = g.score; });
    const wb = XLSX.utils.book_new();
    const used = new Set();
    for (const sub of subs) {
      const students = cache.students.filter(st => st.class_id === sub.class_id);
      if (!students.length) continue;
      const aoa = [["ردیف", "نام خانوادگی", "نام", "نام پدر", "کد ملی", "نام درس", "نمره"]];
      students.forEach((st, i) => aoa.push([i + 1, st.last_name, st.first_name, st.father_name || "", st.national_code || "", sub.subject_name, (gmap[st.id + "|" + sub.id] != null ? gmap[st.id + "|" + sub.id] : "")]));
      let name = (sub.subject_name + " " + className(sub.class_id)).replace(/[\\/?*\[\]:]/g, " ").trim().slice(0, 31) || "درس";
      let base = name, n = 2;
      while (used.has(name)) { name = base.slice(0, 28) + " " + (n++); }
      used.add(name);
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), name);
    }
    if (!wb.SheetNames.length) { msg.innerHTML = '<p class="muted">برای این دبیر کلاسی با دانش‌آموز پیدا نشد.</p>'; return; }
    XLSX.writeFile(wb, "karnameh-" + staffNameOf(tid) + "-" + kxTerm + ".xlsx");
    msg.innerHTML = '<p>فایل ساخته و دانلود شد (' + wb.SheetNames.length + ' شیت).</p>';
  } catch { msg.innerHTML = '<p style="color:#dc2626">ساخت فایل ممکن نشد.</p>'; }
}

    if (!f) { msg.innerHTML = '<p class="muted">اول فایل را انتخاب کنید.</p>'; return; }
    if (!(await askConfirm("بازیابی شروع شود؟ رکوردهای فایل به‌صورت تازه اضافه می‌شوند."))) return;
    msg.innerHTML = '<p class="muted">در حال بازیابی… چند لحظه صبر کنید.</p>';
    try {
      const data = JSON.parse(await f.text());
      if (!data || !data.tables) throw new Error("bad");
      const T = data.tables;
      const strip = (r) => { const c = { ...r }; delete c.id; c.school_id = session.school_id; return c; };
      const yearMap = {}, classMap = {}, staffMap = {}, stuMap = {}, subMap = {};
      for (const r of T.academic_years || []) { const c = await post("/academic_years", strip(r)).catch(() => null); if (c && c[0]) yearMap[r.id] = c[0].id; }
      for (const r of T.classes || []) { const b = strip(r); b.year_id = yearMap[r.year_id] || null; const c = await post("/classes", b).catch(() => null); if (c && c[0]) classMap[r.id] = c[0].id; }
      for (const r of T.staff || []) { const c = await post("/staff", strip(r)).catch(() => null); if (c && c[0]) staffMap[r.id] = c[0].id; }
      for (const r of T.students || []) { const b = strip(r); b.class_id = classMap[r.class_id] || null; b.year_id = yearMap[r.year_id] || null; const c = await post("/students", b).catch(() => null); if (c && c[0]) stuMap[r.id] = c[0].id; }
      for (const r of T.class_subjects || []) { const b = strip(r); b.class_id = classMap[r.class_id] || null; b.teacher_id = staffMap[r.teacher_id] || null; const c = await post("/class_subjects", b).catch(() => null); if (c && c[0]) subMap[r.id] = c[0].id; }
      const bulk = async (table, rows, fix) => {
        const clean = [];
        for (const r of rows || []) { const b = strip(r); if (fix(b, r) === false) continue; clean.push(b); }
        for (let i = 0; i < clean.length; i += 200) await post("/" + table, clean.slice(i, i + 200)).catch(() => null);
        return clean.length;
      };
      let total = 0;
      total += await bulk("discipline_types", T.discipline_types, () => true);
      total += await bulk("attendance", T.attendance, (b, r) => { if (!stuMap[r.student_id]) return false; b.student_id = stuMap[r.student_id]; b.class_id = classMap[r.class_id] || null; b.subject_id = r.subject_id ? (subMap[r.subject_id] || null) : null; });
      total += await bulk("grades", T.grades, (b, r) => { if (!stuMap[r.student_id] || !subMap[r.subject_id]) return false; b.student_id = stuMap[r.student_id]; b.subject_id = subMap[r.subject_id]; b.class_id = classMap[r.class_id] || null; });
      total += await bulk("discipline_records", T.discipline_records, (b, r) => { if (!stuMap[r.student_id]) return false; b.student_id = stuMap[r.student_id]; b.class_id = classMap[r.class_id] || null; b.subject_id = r.subject_id ? (subMap[r.subject_id] || null) : null; });
      total += await bulk("announcements", T.announcements, () => true);
      total += await bulk("homework", T.homework, (b, r) => { b.class_id = classMap[r.class_id] || null; });
      total += await bulk("sms_log", T.sms_log, (b, r) => { b.student_id = stuMap[r.student_id] || null; });
      await refreshCache();
      msg.innerHTML = '<p>بازیابی تمام شد؛ ' + total + ' رکورد وابسته هم اضافه شد. فهرست‌ها را از صفحه‌های مربوطه ببینید.</p>';
    } catch { msg.innerHTML = '<p style="color:#dc2626">بازیابی ممکن نشد؛ فایل پشتیبان معتبر نیست.</p>'; }
  });
}

async function loadGrades() {
  const classId = document.getElementById("grClass").value;
  const subjectId = document.getElementById("grSubject").value;
  const term = document.getElementById("grTerm").value;
  const body = document.getElementById("grBody");
  if (!subjectId) { body.innerHTML = '<p class="muted">برای این کلاس درسی ثبت نشده است.</p>'; return; }
  body.innerHTML = '<p class="muted">در حال بارگذاری…</p>';
  const students = cache.students.filter(s => s.class_id === classId);
  const rows = await get("/grades?select=*&subject_id=eq." + subjectId + "&term=eq." + encodeURIComponent(term)).catch(() => []);
  const gmap = {};
  (rows || []).forEach(r => { gmap[r.student_id] = r; });
  const subj = (cache.subjects || []).find(s => s.id === subjectId);
  const canEdit = session.role === "manager" || (session.role === "teacher" && (!session.staff_id || !subj || !subj.teacher_id || subj.teacher_id === session.staff_id));
  body.innerHTML = students.length ? `<table><thead><tr><th>دانش‌آموز</th><th>نمره</th></tr></thead><tbody>
    ${students.map(s => `<tr><td>${s.first_name} ${s.last_name}</td><td>${canEdit ? `<input class="grScore" data-student="${s.id}" value="${gmap[s.id] ? (gmap[s.id].score || "") : ""}" style="padding:7px 9px;border:1px solid #cbd5e1;border-radius:8px;width:110px">` : (gmap[s.id] && gmap[s.id].score ? gmap[s.id].score : "—")}</td></tr>`).join("")}
    </tbody></table>
    ${canEdit ? '<button class="btn" id="grSave" style="margin-top:14px">ثبت نمرات</button>' : '<p class="muted" style="margin-top:10px">فقط مشاهده — ثبت و ویرایش نمره با دبیر همین درس و مدیر است.</p>'}` : '<p class="muted">این کلاس دانش‌آموزی ندارد.</p>';
  const sv = document.getElementById("grSave");
  if (sv) sv.addEventListener("click", async () => {
    const ups = [], dels = [];
    body.querySelectorAll(".grScore").forEach(inp => {
      const v = inp.value.trim();
      if (v) ups.push({ student_id: inp.dataset.student, subject_id: subjectId, class_id: classId, score: v, term: term, recorded_by: session.username, school_id: session.school_id, updated_at: new Date().toISOString() });
      else if (gmap[inp.dataset.student]) dels.push(inp.dataset.student);
    });
    try {
      if (ups.length) await upsert("/grades?on_conflict=student_id,subject_id,term", ups);
      for (const sid of dels) await api("/grades?subject_id=eq." + subjectId + "&term=eq." + encodeURIComponent(term) + "&student_id=eq." + sid, { method: "DELETE" });
      toast("نمرات ثبت شد"); loadGrades();
    } catch { toast("خطا در ثبت نمرات"); }
  });
}

/* ---------- Bulk import (Excel / CSV) ---------- */
function downloadTemplate(kind) {
  const rows = kind === "students"
    ? [["نام", "نام خانوادگی", "نام کلاس", "نام ولی", "تلفن ولی", "نام پدر", "کد ملی"], ["علی", "احمدی", "هفتم الف", "پدر علی احمدی", "09123456789", "رضا", "0012345678"]]
    : [["نام و نام خانوادگی", "سمت", "شماره پرسنلی"], ["خانم محمدی", "معلم ریاضی", "1024"]];
  const csv = "\uFEFF" + rows.map(r => r.join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = kind === "students" ? "students-template.csv" : "staff-template.csv";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

let xlsxPromise = null;
function loadXLSX() {
  if (window.XLSX) return Promise.resolve();
  if (!xlsxPromise) {
    xlsxPromise = new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
      s.onload = () => resolve();
      s.onerror = () => reject(new Error("xlsx-load-failed"));
      document.head.appendChild(s);
    });
  }
  return xlsxPromise;
}

async function readRows(file) {
  if (/\.csv$/i.test(file.name) || file.type === "text/csv") {
    const text = (await file.text()).replace(/^\uFEFF/, "");
    return parseCsv(text);
  }
  await loadXLSX();
  if (window.XLSX) {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: "array" });
    const ws = wb.Sheets[wb.SheetNames[0]];
    return XLSX.utils.sheet_to_json(ws, { defval: "" }).map(r => {
      const o = {};
      Object.keys(r).forEach(k => { o[String(k).trim()] = String(r[k]).trim(); });
      return o;
    });
  }
  throw new Error("xlsx-unavailable");
}

function parseCsv(text) {
  const rows = [];
  let row = [], cell = "", inQ = false;
  const s = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n");
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (inQ) {
      if (ch === '"') { if (s[i + 1] === '"') { cell += '"'; i++; } else inQ = false; }
      else cell += ch;
    } else if (ch === '"') inQ = true;
    else if (ch === ",") { row.push(cell); cell = ""; }
    else if (ch === "\n") { row.push(cell); cell = ""; rows.push(row); row = []; }
    else cell += ch;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  const data = rows.filter(r => r.some(c => String(c).trim() !== ""));
  if (!data.length) return [];
  const heads = data[0].map(h => String(h).trim());
  return data.slice(1).map(cells => {
    const o = {};
    heads.forEach((h, i) => { o[h] = String(cells[i] || "").trim(); });
    return o;
  });
}

function normFa(s) {
  return String(s || "").replace(/\u064A/g, "\u06CC").replace(/\u0643/g, "\u06A9").replace(/\u200C/g, " ").replace(/\s+/g, " ").trim();
}
function fixPhone(v) {
  v = String(v || "").replace(/\D/g, "");
  if (/^9\d{9}$/.test(v)) v = "0" + v;
  return v;
}
function pick(row, names) {
  const keys = Object.keys(row);
  for (const n of names) {
    const nn = normFa(n);
    for (const k of keys) { if (normFa(k) === nn && row[k]) return row[k]; }
  }
  return "";
}

async function importStudents(rows) {
  let added = 0, skipped = 0, errors = 0;
  const existing = new Set(cache.students.map(s => s.first_name + "|" + s.last_name + "|" + s.class_id));
  const toInsert = [];
  for (const r of rows) {
    const first = pick(r, ["نام", "first_name"]);
    const last = pick(r, ["نام خانوادگی", "last_name"]);
    const clsName = normFa(pick(r, ["نام کلاس", "کلاس", "class_name", "class"]));
    if (!first || !last || !clsName) { errors++; continue; }
    let cls = cache.classes.find(c => c.name === clsName);
    if (!cls) {
      const parts = clsName.split(/\s+/);
      const grade = parts.length > 1 ? parts.slice(0, -1).join(" ") : clsName;
      try {
        const created = await post("/classes", { name: clsName, grade: grade });
        cls = created[0];
        cache.classes.push(cls);
      } catch { errors++; continue; }
    }
    const key = first + "|" + last + "|" + cls.id;
    if (existing.has(key)) { skipped++; continue; }
    existing.add(key);
    toInsert.push({ first_name: first, last_name: last, class_id: cls.id, parent_name: pick(r, ["نام ولی", "ولی", "parent_name"]) || null, parent_phone: fixPhone(pick(r, ["تلفن ولی", "تلفن", "parent_phone"])) || null, father_name: pick(r, ["نام پدر", "پدر", "father_name"]) || null, national_code: normDigits(pick(r, ["کد ملی", "کدملی", "national_code"])) || null, year_id: cls.year_id || null, school_id: session.school_id });
  }
  if (toInsert.length) {
    try { await post("/students", toInsert); added = toInsert.length; }
    catch { errors += toInsert.length; }
  }
  await refreshCache();
  return `<p>نتیجه ورود دانش‌آموزان: <b>${added}</b> نفر اضافه شد، <b>${skipped}</b> تکراری رد شد، <b>${errors}</b> ردیف خطادار.</p>`;
}

async function importStaff(rows) {
  let errors = 0;
  const payload = [];
  for (const r of rows) {
    const name = pick(r, ["نام و نام خانوادگی", "نام", "full_name"]);
    const job = pick(r, ["سمت", "job_title"]);
    if (!name || !job) { errors++; continue; }
    payload.push({ full_name: name, job_title: job, personnel_code: normDigits(pick(r, ["شماره پرسنلی", "کد پرسنلی", "پرسنلی", "personnel_code", "code"])) || null, school_id: session.school_id });
  }
  let added = 0;
  if (payload.length) {
    try {
      const res = await api("/staff", { method: "POST", body: JSON.stringify(payload), headers: { "Prefer": "resolution=ignore-duplicates,return=representation" } });
      added = res ? res.length : 0;
    } catch { errors += payload.length; }
  }
  await refreshCache();
  return `<p>نتیجه ورود پرسنل: <b>${added}</b> نفر اضافه شد، <b>${payload.length - added}</b> تکراری رد شد، <b>${errors}</b> ردیف خطادار.</p>`;
}

function wireFileImport(fileId, boxId, handler) {
  const input = document.getElementById(fileId);
  if (!input) return;
  input.addEventListener("change", async () => {
    if (!input.files || !input.files.length) return;
    const box = document.getElementById(boxId);
    if (box) box.innerHTML = '<p class="muted">در حال خواندن فایل…</p>';
    try {
      const rows = await readRows(input.files[0]);
      const msg = await handler(rows);
      render();
      const newBox = document.getElementById(boxId);
      if (newBox) newBox.innerHTML = msg;
    } catch (e) {
      const b2 = document.getElementById(boxId);
      if (b2) b2.innerHTML = '<p style="color:#dc2626">خواندن فایل ممکن نشد؛ از «دانلود فایل نمونه» استفاده کنید و همان قالب را پر کنید.</p>';
    }
  });
}

      <div class="field" style="max-width:220px"><label>رمز حساب‌های جدید</label><input id="accPassTeacher" value="1234"></div>
      <table><thead><tr><th>نام</th><th>سمت</th><th>نام کاربری</th><th>نقش</th><th></th></tr></thead><tbody>
      ${cache.staff.length === 0 ? `<tr><td colspan="4" class="muted">هنوز دبیری ثبت نشده است. اول از تب «پرسنل» دبیر را اضافه کنید (یا با فایل اکسل وارد کنید)؛ بعد اینجا در همین فهرست ظاهر می‌شود و برایش حساب می‌سازید.</td></tr>` : ""}
      ${cache.staff.map((s, i) => byStaff[s.id]
        ? `<tr><td>${s.full_name}</td><td>${s.job_title}</td><td colspan="2"><span class="badge role">حساب دارد: ${byStaff[s.id].username}</span></td></tr>`
        : `<tr><td>${s.full_name}</td><td>${s.job_title}</td>
           <td><input id="u-staff-${s.id}" value="t${s.personnel_code ? String(s.personnel_code).replace(/\D/g, "") : (101 + i)}" dir="ltr" style="padding:7px 9px;border:1px solid #cbd5e1;border-radius:8px"></td>
           <td><select id="role-staff-${s.id}" style="padding:7px 9px;border:1px solid #cbd5e1;border-radius:8px"><option value="teacher">معلم</option><option value="deputy">معاون آموزشی</option></select></td>
           <td><button class="btn small" data-create="teacher" data-id="${s.id}">ساخت حساب</button></td></tr>`).join("")}
      </tbody></table></div>

    <div class="panel"><h2>ساخت حساب برای دانش‌آموز و ولی او</h2>
      <div class="field" style="max-width:220px"><label>رمز حساب‌های جدید</label><input id="accPassFam" value="1234"></div>
      <table><thead><tr><th>دانش‌آموز</th><th>کلاس</th><th>حساب دانش‌آموز</th><th>حساب ولی</th></tr></thead><tbody>
      ${cache.students.length === 0 ? `<tr><td colspan="4" class="muted">هنوز دانش‌آموزی ثبت نشده است. اول از تب «دانش‌آموزان» دانش‌آموز را اضافه کنید (یا با فایل اکسل وارد کنید)؛ بعد اینجا برای خودش و ولی‌اش حساب می‌سازید.</td></tr>` : ""}
      ${cache.students.map((s, i) => {
        const sa = byStudentRole[s.id + "|student"];
        const pa = byStudentRole[s.id + "|parent"];
        return `<tr><td>${s.first_name} ${s.last_name}</td><td>${className(s.class_id)}</td>
        <td>${sa ? `<span class="badge role">${sa.username}</span>` : `<span style="display:flex;gap:6px"><input id="u-stu-${s.id}" value="s${101 + i}" dir="ltr" style="padding:7px 9px;border:1px solid #cbd5e1;border-radius:8px;width:90px"><button class="btn small" data-create="student" data-id="${s.id}">ساخت</button></span>`}</td>
        <td>${pa ? `<span class="badge role">${pa.username}</span>` : `<span style="display:flex;gap:6px"><input id="u-par-${s.id}" value="p${s.parent_phone ? s.parent_phone.replace(/\D/g, "").slice(-6) : (201 + i)}" dir="ltr" style="padding:7px 9px;border:1px solid #cbd5e1;border-radius:8px;width:90px"><button class="btn small" data-create="parent" data-id="${s.id}">ساخت</button></span>`}</td></tr>`;
      }).join("")}
      </tbody></table>
      <p class="muted" style="margin-top:8px">نام کاربری‌ها پیشنهاد خودکارند و قبل از ساخت می‌توانید عوضشان کنید. رمز پیش‌فرض را هم می‌توانید برای همه یک رمز بگذارید و بعداً از جدول «حساب‌های موجود» برای هر نفر جدا عوض کنید.</p></div>`;

  m.querySelectorAll("[data-create]").forEach(btn => btn.addEventListener("click", async () => {
    const kind = btn.dataset.create, id = btn.dataset.id;
    let body = null;
    if (kind === "teacher") {
      const s = cache.staff.find(x => x.id === id);
      body = { p_username: val("u-staff-" + id), p_password: val("accPassTeacher") || "1234", p_full_name: s.full_name, p_role: val("role-staff-" + id) || "teacher", p_staff_id: id, p_student_id: null, p_school_id: session.school_id };
    } else if (kind === "student") {
      const s = cache.students.find(x => x.id === id);
      body = { p_username: val("u-stu-" + id), p_password: val("accPassFam") || "1234", p_full_name: s.first_name + " " + s.last_name, p_role: "student", p_staff_id: null, p_student_id: id, p_school_id: session.school_id };
    } else {
      const s = cache.students.find(x => x.id === id);
      body = { p_username: val("u-par-" + id), p_password: val("accPassFam") || "1234", p_full_name: s.parent_name || ("ولی " + s.first_name + " " + s.last_name), p_role: "parent", p_staff_id: null, p_student_id: id, p_school_id: session.school_id };
    }
    if (!body.p_username) { toast("نام کاربری را وارد کنید"); return; }
    btn.disabled = true;
    try { await post("/rpc/create_account", body); toast("حساب ساخته شد: " + body.p_username); render(); }
    catch { toast("ساخت حساب نشد — شاید نام کاربری تکراری است"); btn.disabled = false; }
  }));
  m.querySelectorAll("[data-reset]").forEach(btn => btn.addEventListener("click", async () => {
    const np = prompt("رمز جدید را وارد کنید:");
    if (!np) return;
    try { await api("/rpc/set_account_password", { method: "POST", body: JSON.stringify({ p_id: btn.dataset.reset, p_password: np }) }); toast("رمز عوض شد"); }
    catch { toast("خطا در تغییر رمز"); }
  }));
  m.querySelectorAll("[data-del]").forEach(btn => btn.addEventListener("click", async () => {
    if (!(await askConfirm("حساب «" + btn.dataset.name + "» حذف شود؟"))) return;
    try { await api("/profiles?id=eq." + btn.dataset.del, { method: "DELETE" }); toast("حساب حذف شد"); render(); }
    catch { toast("خطا در حذف"); }
  }));
  const dg = document.createElement("div");
  dg.className = "panel";
  dg.innerHTML = delegationPanelHtml(profiles);
  m.appendChild(dg);
  wireDelegation(dg, profiles);
}

/* ---------- Init ---------- */
(async () => {
  const saved = localStorage.getItem("school_session");
  if (saved) {
    try { session = JSON.parse(saved); if (!session.school_id) throw new Error("old session"); await enterApp(); }
    catch { localStorage.removeItem("school_session"); session = null; document.getElementById("appView").classList.add("hidden"); document.getElementById("loginView").classList.remove("hidden"); }
  }
})();
</script>
</body>
</html>
