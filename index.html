<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NazmYar</title>
<link rel="preload" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Vazirmatn', Tahoma, sans-serif; background: #f1f5f9; color: #0f172a; min-height: 100vh; }
  button, input, select, textarea { font-family: inherit; }
  .hidden { display: none !important; }
  /* Login */
  #loginView { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; background: linear-gradient(135deg, #1e3a8a, #0ea5e9); }
  .login-card { background: #fff; border-radius: 16px; padding: 28px 24px; width: 100%; max-width: 380px; box-shadow: 0 20px 40px rgba(0,0,0,.25); }
  .login-card h1 { font-size: 22px; text-align: center; margin-bottom: 6px; }
  .login-card p.sub { text-align: center; color: #64748b; font-size: 13px; margin-bottom: 20px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; margin-bottom: 6px; color: #334155; }
  .field input, .field select, .field textarea { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 14px; background: #fff; }
  .btn { background: #2563eb; color: #fff; border: none; padding: 11px 18px; border-radius: 10px; font-size: 14px; cursor: pointer; width: 100%; }
  .btn:hover { background: #1d4ed8; }
  .btn.secondary { background: #e2e8f0; color: #0f172a; }
  .btn.small { width: auto; padding: 8px 14px; font-size: 13px; }
  .demo-hint { margin-top: 16px; background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 10px; padding: 10px 12px; font-size: 12px; color: #475569; line-height: 2; }
  .error { color: #dc2626; font-size: 13px; text-align: center; min-height: 18px; margin-bottom: 8px; }
  /* Layout */
  header.topbar { background: #1e3a8a; color: #fff; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 20; }
  header.topbar .title { font-size: 16px; font-weight: 700; }
  header.topbar .user { font-size: 12px; opacity: .9; }
  header.topbar button { background: rgba(255,255,255,.15); color: #fff; border: none; padding: 7px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; }
  nav.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 10px 12px; background: #fff; border-bottom: 1px solid #e2e8f0; position: sticky; top: 49px; z-index: 19; }
  nav.tabs button { white-space: nowrap; border: 1px solid #e2e8f0; background: #f8fafc; padding: 8px 14px; border-radius: 999px; font-size: 13px; cursor: pointer; }
  nav.tabs button.active { background: #2563eb; color: #fff; border-color: #2563eb; }
  main { padding: 16px 12px 40px; max-width: 980px; margin: 0 auto; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .card { background: #fff; border-radius: 14px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .card .num { font-size: 26px; font-weight: 800; color: #1e3a8a; }
  .card .lbl { font-size: 12px; color: #64748b; margin-top: 4px; }
  .panel { background: #fff; border-radius: 14px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06); margin-bottom: 16px; }
  .panel h2 { font-size: 16px; margin-bottom: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 9px 8px; border-bottom: 1px solid #eef2f7; text-align: right; }
  th { color: #64748b; font-weight: 600; font-size: 12px; }
  .row-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; align-items: end; }
  .row-actions .field { margin-bottom: 0; flex: 1; min-width: 140px; }
  .seg { display: inline-flex; border: 1px solid #cbd5e1; border-radius: 999px; overflow: hidden; }
  .seg button { border: none; background: #fff; padding: 6px 12px; font-size: 12px; cursor: pointer; }
  .seg button.on-present { background: #16a34a; color: #fff; }
  .seg button.on-absent { background: #dc2626; color: #fff; }
  .seg button.on-late { background: #d97706; color: #fff; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 11px; }
  .badge.present { background: #dcfce7; color: #166534; }
  .badge.absent { background: #fee2e2; color: #991b1b; }
  .badge.late { background: #fef3c7; color: #92400e; }
  .badge.role { background: #dbeafe; color: #1e40af; }
  .muted { color: #64748b; font-size: 12px; }
  .toast { position: fixed; bottom: 18px; right: 50%; transform: translateX(50%); background: #0f172a; color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 13px; z-index: 50; box-shadow: 0 8px 20px rgba(0,0,0,.3); }
  .confirm-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: none; align-items: center; justify-content: center; z-index: 60; padding: 16px; }
  .confirm-card { background: #fff; border-radius: 14px; padding: 20px; max-width: 340px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,.2); }
  .confirm-card p { margin: 0 0 16px; font-size: 15px; line-height: 1.9; }
  .confirm-actions { display: flex; gap: 8px; }
  .confirm-actions .btn { flex: 1; }
  .btn.danger { background: #b91c1c; color: #fff; border-color: #b91c1c; }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
</style>
</head>
<body>

<!-- ===== Login ===== -->
<div id="loginView">
  <div class="login-card">
    <h1>NazmYar</h1>
    <p class="sub">برای ورود، نام کاربری و رمز عبور را وارد کنید</p>
    <div class="error" id="loginError"></div>
    <form id="loginForm">
      <div class="field"><label>نام کاربری</label><input id="loginUser" autocomplete="username" required></div>
      <div class="field"><label>رمز عبور</label><input id="loginPass" type="password" autocomplete="current-password" required></div>
      <button class="btn" type="submit" id="loginBtn">ورود</button>
    </form>
    <div class="demo-hint">
      حساب‌های نمایشی (رمز همه: 1234)<br>
      مدیر: <b>modir</b> &nbsp;|&nbsp; معلم: <b>moalem</b> &nbsp;|&nbsp; ولی: <b>vali</b>
    </div>
  </div>
</div>

<!-- ===== App ===== -->
<div id="appView" class="hidden">
  <header class="topbar">
    <div>
      <div class="title">NazmYar</div>
      <div class="user" id="whoAmI"></div>
    </div>
    <button id="logoutBtn">خروج</button>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="main"></main>
</div>

<div id="toast" class="toast hidden"></div>
<div id="confirmModal" class="confirm-overlay">
  <div class="confirm-card">
    <p id="confirmText"></p>
    <div class="confirm-actions">
      <button class="btn danger" id="confirmYes">بله، حذف کن</button>
      <button class="btn secondary" id="confirmNo">انصراف</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://noxycrhmudyqxihrhyvi.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5veHljcmhtdWR5cXhpaHJoeXZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0OTc5MzIsImV4cCI6MjExMDA3MzkzMn0.mQRwtQQHYG6qt5B-8D5D9MtdReCyXtgPRkm_ybSLZSE";
const API = SUPABASE_URL + "/rest/v1";
const HEADERS = { "apikey": SUPABASE_ANON_KEY, "Authorization": "Bearer " + SUPABASE_ANON_KEY, "Content-Type": "application/json" };

let session = null;       // {id, username, full_name, role}
let cache = { classes: [], students: [], staff: [] };
let currentTab = "dashboard";

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.remove("hidden");
  setTimeout(() => t.classList.add("hidden"), 2600);
}
let confirmResolve = null;
function askConfirm(msg) {
  return new Promise((resolve) => {
    confirmResolve = resolve;
    document.getElementById("confirmText").textContent = msg;
    document.getElementById("confirmModal").style.display = "flex";
  });
}
function settleConfirm(v) {
  document.getElementById("confirmModal").style.display = "none";
  if (confirmResolve) { const r = confirmResolve; confirmResolve = null; r(v); }
}
document.getElementById("confirmYes").addEventListener("click", () => settleConfirm(true));
document.getElementById("confirmNo").addEventListener("click", () => settleConfirm(false));
document.getElementById("confirmModal").addEventListener("click", (e) => { if (e.target.id === "confirmModal") settleConfirm(false); });
function faDate(iso) {
  if (!iso) return "—";
  try { return new Date(iso + (iso.length === 10 ? "T00:00:00" : "")).toLocaleDateString("fa-IR"); } catch { return iso; }
}
function todayISO() { return new Date().toISOString().slice(0, 10); }

async function api(path, opts = {}) {
  const { headers: extraHeaders, ...rest } = opts;
  const res = await fetch(API + path, { ...rest, headers: { ...HEADERS, ...(extraHeaders || {}) } });
  if (!res.ok) { const txt = await res.text(); throw new Error(txt || ("HTTP " + res.status)); }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}
const get = (path) => api(path);
const post = (path, body, prefer = "return=representation") => api(path, { method: "POST", body: JSON.stringify(body), headers: { "Prefer": prefer } });
const upsert = (path, body) => api(path, { method: "POST", body: JSON.stringify(body), headers: { "Prefer": "resolution=merge-duplicates,return=representation" } });

/* ---------- Auth ---------- */
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const u = document.getElementById("loginUser").value.trim();
  const p = document.getElementById("loginPass").value;
  const err = document.getElementById("loginError");
  err.textContent = "";
  document.getElementById("loginBtn").textContent = "در حال بررسی…";
  try {
    const rows = await post("/rpc/login_check", { p_username: u, p_password: p });
    if (!rows || !rows.length) { err.textContent = "نام کاربری یا رمز عبور اشتباه است."; return; }
    session = rows[0];
    localStorage.setItem("school_session", JSON.stringify(session));
    enterApp();
  } catch (ex) { err.textContent = "خطا در اتصال به سامانه."; }
  finally { document.getElementById("loginBtn").textContent = "ورود"; }
});
document.getElementById("logoutBtn").addEventListener("click", () => {
  session = null; localStorage.removeItem("school_session");
  document.getElementById("appView").classList.add("hidden");
  document.getElementById("loginView").classList.remove("hidden");
});

const ROLE_FA = { manager: "مدیر", teacher: "معلم", parent: "ولی", student: "دانش‌آموز" };
const TABS = [
  { id: "dashboard", label: "داشبورد", roles: ["manager", "teacher", "parent", "student"] },
  { id: "attendance", label: "حضور و غیاب", roles: ["manager", "teacher"] },
  { id: "myattendance", label: "حضور و غیاب", roles: ["parent", "student"] },
  { id: "students", label: "دانش‌آموزان", roles: ["manager", "teacher"] },
  { id: "classes", label: "کلاس‌ها", roles: ["manager", "teacher"] },
  { id: "staff", label: "پرسنل", roles: ["manager"] },
  { id: "accounts", label: "حساب‌های کاربری", roles: ["manager"] },
  { id: "sms", label: "پنل پیامک", roles: ["manager", "teacher", "parent"] },
  { id: "announcements", label: "اطلاعیه‌ها", roles: ["manager", "teacher", "parent", "student"] },
  { id: "homework", label: "تکالیف", roles: ["manager", "teacher", "parent", "student"] },
];

async function enterApp() {
  document.getElementById("loginView").classList.add("hidden");
  document.getElementById("appView").classList.remove("hidden");
  document.getElementById("whoAmI").textContent = session.full_name + " — " + (ROLE_FA[session.role] || session.role);
  const nav = document.getElementById("tabs");
  nav.innerHTML = "";
  TABS.filter(t => t.roles.includes(session.role)).forEach(t => {
    const b = document.createElement("button");
    b.textContent = t.label; b.dataset.tab = t.id;
    b.addEventListener("click", () => { currentTab = t.id; render(); });
    nav.appendChild(b);
  });
  await refreshCache();
  currentTab = "dashboard";
  render();
}
async function refreshCache() {
  const [classes, students, staff] = await Promise.all([
    get("/classes?select=*&order=grade"), get("/students?select=*&order=last_name"), get("/staff?select=*")
  ]);
  cache = { classes: classes || [], students: students || [], staff: staff || [] };
}
function className(id) { const c = cache.classes.find(c => c.id === id); return c ? c.name : "—"; }
function studentName(id) { const s = cache.students.find(s => s.id === id); return s ? (s.first_name + " " + s.last_name) : "—"; }

function render() {
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === currentTab));
  const m = document.getElementById("main");
  if (currentTab === "dashboard") return viewDashboard(m);
  if (currentTab === "attendance") return viewAttendance(m);
  if (currentTab === "myattendance") return viewMyAttendance(m);
  if (currentTab === "students") return viewStudents(m);
  if (currentTab === "classes") return viewClasses(m);
  if (currentTab === "staff") return viewStaff(m);
  if (currentTab === "accounts") return viewAccounts(m);
  if (currentTab === "sms") return viewSms(m);
  if (currentTab === "announcements") return viewAnnouncements(m);
  if (currentTab === "homework") return viewHomework(m);
}

/* ---------- Dashboard ---------- */
async function viewDashboard(m) {
  m.innerHTML = '<div class="panel">در حال بارگذاری…</div>';
  if ((session.role === "parent" || session.role === "student") && session.student_id) {
    const stu = cache.students.find(s => s.id === session.student_id);
    const rows = await get("/attendance?select=status,attendance_date&student_id=eq." + session.student_id + "&order=attendance_date.desc").catch(() => []);
    const c = (s) => (rows || []).filter(r => r.status === s).length;
    const STA = { present: "حاضر", absent: "غایب", late: "تأخیر" };
    m.innerHTML = `
      <div class="panel">
        <h2>${session.role === "parent" ? "فرزند شما" : "داشبورد من"} — ${stu ? stu.first_name + " " + stu.last_name : session.full_name}</h2>
        <p>کلاس: <b>${stu ? className(stu.class_id) : "—"}</b></p>
        <p style="margin-top:8px">مجموع حضور: <b>${c("present")}</b> &nbsp;|&nbsp; غیبت: <b>${c("absent")}</b> &nbsp;|&nbsp; تأخیر: <b>${c("late")}</b></p>
      </div>
      <div class="panel"><h2>آخرین وضعیت‌ها</h2>
        ${(rows && rows.length) ? `<table><thead><tr><th>تاریخ</th><th>وضعیت</th></tr></thead><tbody>
          ${rows.slice(0, 10).map(r => `<tr><td>${faDate(r.attendance_date)}</td><td><span class="badge ${r.status}">${STA[r.status]}</span></td></tr>`).join("")}
          </tbody></table>` : '<p class="muted">هنوز حضور و غیابی ثبت نشده است.</p>'}
      </div>`;
    return;
  }
  const today = todayISO();
  const att = await get("/attendance?select=status&attendance_date=eq." + today).catch(() => []);
  const smsCount = await get("/sms_log?select=id").catch(() => []);
  const cnt = (s) => (att || []).filter(a => a.status === s).length;
  m.innerHTML = `
    <div class="cards">
      <div class="card"><div class="num">${cache.students.length}</div><div class="lbl">دانش‌آموز</div></div>
      <div class="card"><div class="num">${cache.classes.length}</div><div class="lbl">کلاس</div></div>
      <div class="card"><div class="num">${cache.staff.length}</div><div class="lbl">پرسنل</div></div>
      <div class="card"><div class="num">${smsCount ? smsCount.length : 0}</div><div class="lbl">پیامک ثبت‌شده</div></div>
    </div>
    <div class="panel">
      <h2>حضور و غیاب امروز — ${faDate(today)}</h2>
      <p>حاضر: <b>${cnt("present")}</b> &nbsp;|&nbsp; غایب: <b>${cnt("absent")}</b> &nbsp;|&nbsp; تأخیر: <b>${cnt("late")}</b></p>
      <p class="muted" style="margin-top:8px">حضور و غیابی که معلم ثبت کند، بلافاصله همین‌جا برای مدیر دیده می‌شود.</p>
    </div>`;
}

/* ---------- Attendance ---------- */
let attState = {}; // student_id -> status
async function viewAttendance(m) {
  const today = todayISO();
  m.innerHTML = `
    <div class="panel">
      <h2>ثبت حضور و غیاب</h2>
      <div class="row-actions">
        <div class="field"><label>کلاس</label><select id="attClass">${cache.classes.map(c => `<option value="${c.id}">${c.name}</option>`).join("")}</select></div>
        <div class="field"><label>تاریخ</label><input type="date" id="attDate" value="${today}"></div>
        <button class="btn small" id="attLoad">نمایش فهرست</button>
      </div>
      <div id="attBody"><p class="muted">یک کلاس را انتخاب کنید و «نمایش فهرست» را بزنید.</p></div>
    </div>
    <div class="panel">
      <h2>آخرین ثبت‌ها</h2>
      <div id="attRecent"><p class="muted">در حال بارگذاری…</p></div>
    </div>`;
  document.getElementById("attLoad").addEventListener("click", loadAttList);
  loadAttRecent();
}
async function loadAttList() {
  const classId = document.getElementById("attClass").value;
  const date = document.getElementById("attDate").value || todayISO();
  const body = document.getElementById("attBody");
  body.innerHTML = '<p class="muted">در حال بارگذاری…</p>';
  const students = cache.students.filter(s => s.class_id === classId);
  const existing = await get(`/attendance?select=student_id,status&class_id=eq.${classId}&attendance_date=eq.${date}`).catch(() => []);
  attState = {};
  (existing || []).forEach(r => attState[r.student_id] = r.status);
  if (!students.length) { body.innerHTML = '<p class="muted">این کلاس دانش‌آموزی ندارد.</p>'; return; }
  body.innerHTML = `
    <table><thead><tr><th>دانش‌آموز</th><th>وضعیت</th></tr></thead><tbody>
    ${students.map(s => `
      <tr><td>${s.first_name} ${s.last_name}</td>
      <td><span class="seg" data-student="${s.id}">
        ${["present", "absent", "late"].map(st => `<button type="button" data-status="${st}" class="${(attState[s.id] || "present") === st ? "on-" + st : ""}">${{ present: "حاضر", absent: "غایب", late: "تأخیر" }[st]}</button>`).join("")}
      </span></td></tr>`).join("")}
    </tbody></table>
    <button class="btn" id="attSave" style="margin-top:14px">ثبت حضور و غیاب</button>`;
  body.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
    const seg = b.closest(".seg"); const sid = seg.dataset.student;
    attState[sid] = b.dataset.status;
    seg.querySelectorAll("button").forEach(x => x.className = x.dataset.status === attState[sid] ? "on-" + attState[sid] : "");
  }));
  document.getElementById("attSave").addEventListener("click", async () => {
    const rows = students.map(s => ({ student_id: s.id, class_id: classId, attendance_date: date, status: attState[s.id] || "present", recorded_by: session.username }));
    try { await upsert("/attendance", rows); toast("حضور و غیاب ثبت شد"); loadAttRecent(); }
    catch (ex) { toast("خطا در ثبت"); }
  });
}
async function loadAttRecent() {
  const box = document.getElementById("attRecent");
  const rows = await get("/attendance?select=*&order=created_at.desc&limit=30").catch(() => []);
  if (!rows || !rows.length) { box.innerHTML = '<p class="muted">هنوز ثبتی انجام نشده است.</p>'; return; }
  const STA = { present: "حاضر", absent: "غایب", late: "تأخیر" };
  box.innerHTML = `<table><thead><tr><th>دانش‌آموز</th><th>کلاس</th><th>تاریخ</th><th>وضعیت</th><th>ثبت‌کننده</th><th>عملیات</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td>${studentName(r.student_id)}</td><td>${className(r.class_id)}</td><td>${faDate(r.attendance_date)}</td><td><span class="badge ${r.status}">${STA[r.status]}</span></td><td>${r.recorded_by || "—"}</td><td><button class="btn small secondary" data-del-att="${r.id}">حذف</button></td></tr>`).join("")}
    </tbody></table>`;
  box.querySelectorAll("[data-del-att]").forEach(btn => btn.addEventListener("click", async () => {
    if (!(await askConfirm("این رکورد حضور و غیاب حذف شود؟"))) return;
    try { await api("/attendance?id=eq." + btn.dataset.delAtt, { method: "DELETE" }); toast("حذف شد"); loadAttRecent(); }
    catch { toast("خطا در حذف"); }
  }));
}

/* ---------- Students ---------- */
async function viewStudents(m) {
  m.innerHTML = `
    <div class="panel">
      <h2>افزودن دانش‌آموز</h2>
      <form id="stuForm"><div class="form-grid">
        <div class="field"><label>نام</label><input id="stuFirst" required></div>
        <div class="field"><label>نام خانوادگی</label><input id="stuLast" required></div>
        <div class="field"><label>کلاس</label><select id="stuClass">${cache.classes.map(c => `<option value="${c.id}">${c.name}</option>`).join("")}</select></div>
        <div class="field"><label>نام ولی</label><input id="stuParent"></div>
        <div class="field"><label>تلفن ولی</label><input id="stuPhone"></div>
      </div><button class="btn small" style="margin-top:10px">افزودن</button></form>
    </div>

/* ---------- Bulk import (Excel / CSV) ---------- */
function downloadTemplate(kind) {
  const rows = kind === "students"
    ? [["نام", "نام خانوادگی", "نام کلاس", "نام ولی", "تلفن ولی"], ["علی", "احمدی", "هفتم الف", "پدر علی احمدی", "09123456789"]]
    : [["نام و نام خانوادگی", "سمت", "تلفن"], ["خانم محمدی", "معلم ریاضی", "09123456789"]];
  const csv = "\uFEFF" + rows.map(r => r.join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = kind === "students" ? "students-template.csv" : "staff-template.csv";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

let xlsxPromise = null;
function loadXLSX() {
  if (window.XLSX) return Promise.resolve();
  if (!xlsxPromise) {
    xlsxPromise = new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
      s.onload = () => resolve();
      s.onerror = () => reject(new Error("xlsx-load-failed"));
      document.head.appendChild(s);
    });
  }
  return xlsxPromise;
}

async function readRows(file) {
  if (/\.csv$/i.test(file.name) || file.type === "text/csv") {
    const text = (await file.text()).replace(/^\uFEFF/, "");
    return parseCsv(text);
  }
  await loadXLSX();
  if (window.XLSX) {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: "array" });
    const ws = wb.Sheets[wb.SheetNames[0]];
    return XLSX.utils.sheet_to_json(ws, { defval: "" }).map(r => {
      const o = {};
      Object.keys(r).forEach(k => { o[String(k).trim()] = String(r[k]).trim(); });
      return o;
    });
  }
  throw new Error("xlsx-unavailable");
}

function parseCsv(text) {
  const rows = [];
  let row = [], cell = "", inQ = false;
  const s = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n");
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (inQ) {
      if (ch === '"') { if (s[i + 1] === '"') { cell += '"'; i++; } else inQ = false; }
      else cell += ch;
    } else if (ch === '"') inQ = true;
    else if (ch === ",") { row.push(cell); cell = ""; }
    else if (ch === "\n") { row.push(cell); cell = ""; rows.push(row); row = []; }
    else cell += ch;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  const data = rows.filter(r => r.some(c => String(c).trim() !== ""));
  if (!data.length) return [];
  const heads = data[0].map(h => String(h).trim());
  return data.slice(1).map(cells => {
    const o = {};
    heads.forEach((h, i) => { o[h] = String(cells[i] || "").trim(); });
    return o;
  });
}

function normFa(s) {
  return String(s || "").replace(/\u064A/g, "\u06CC").replace(/\u0643/g, "\u06A9").replace(/\u200C/g, " ").replace(/\s+/g, " ").trim();
}
function fixPhone(v) {
  v = String(v || "").replace(/\D/g, "");
  if (/^9\d{9}$/.test(v)) v = "0" + v;
  return v;
}
function pick(row, names) {
  const keys = Object.keys(row);
  for (const n of names) {
    const nn = normFa(n);
    for (const k of keys) { if (normFa(k) === nn && row[k]) return row[k]; }
  }
  return "";
}

async function importStudents(rows) {
  let added = 0, skipped = 0, errors = 0;
  const existing = new Set(cache.students.map(s => s.first_name + "|" + s.last_name + "|" + s.class_id));
  const toInsert = [];
  for (const r of rows) {
    const first = pick(r, ["نام", "first_name"]);
    const last = pick(r, ["نام خانوادگی", "last_name"]);
    const clsName = normFa(pick(r, ["نام کلاس", "کلاس", "class_name", "class"]));
    if (!first || !last || !clsName) { errors++; continue; }
    let cls = cache.classes.find(c => c.name === clsName);
    if (!cls) {
      const parts = clsName.split(/\s+/);
      const grade = parts.length > 1 ? parts.slice(0, -1).join(" ") : clsName;
      try {
        const created = await post("/classes", { name: clsName, grade: grade, teacher_name: null });
        cls = created[0];
        cache.classes.push(cls);
      } catch { errors++; continue; }
    }
    const key = first + "|" + last + "|" + cls.id;
    if (existing.has(key)) { skipped++; continue; }
    existing.add(key);
    toInsert.push({ first_name: first, last_name: last, class_id: cls.id, parent_name: pick(r, ["نام ولی", "ولی", "parent_name"]) || null, parent_phone: fixPhone(pick(r, ["تلفن ولی", "تلفن", "parent_phone"])) || null });
  }
  if (toInsert.length) {
    try { await post("/students", toInsert); added = toInsert.length; }
    catch { errors += toInsert.length; }
  }
  await refreshCache();
  return `<p>نتیجه ورود دانش‌آموزان: <b>${added}</b> نفر اضافه شد، <b>${skipped}</b> تکراری رد شد، <b>${errors}</b> ردیف خطادار.</p>`;
}

async function importStaff(rows) {
  let errors = 0;
  const payload = [];
  for (const r of rows) {
    const name = pick(r, ["نام و نام خانوادگی", "نام", "full_name"]);
    const job = pick(r, ["سمت", "job_title"]);
    if (!name || !job) { errors++; continue; }
    payload.push({ full_name: name, job_title: job, phone: fixPhone(pick(r, ["تلفن", "phone"])) || null });
  }
  let added = 0;
  if (payload.length) {
    try {
      const res = await api("/staff", { method: "POST", body: JSON.stringify(payload), headers: { "Prefer": "resolution=ignore-duplicates,return=representation" } });
      added = res ? res.length : 0;
    } catch { errors += payload.length; }
  }
  await refreshCache();
  return `<p>نتیجه ورود پرسنل: <b>${added}</b> نفر اضافه شد، <b>${payload.length - added}</b> تکراری رد شد، <b>${errors}</b> ردیف خطادار.</p>`;
}

function wireFileImport(fileId, boxId, handler) {
  const input = document.getElementById(fileId);
  if (!input) return;
  input.addEventListener("change", async () => {
    if (!input.files || !input.files.length) return;
    const box = document.getElementById(boxId);
    if (box) box.innerHTML = '<p class="muted">در حال خواندن فایل…</p>';
    try {
      const rows = await readRows(input.files[0]);
      const msg = await handler(rows);
      render();
      const newBox = document.getElementById(boxId);
      if (newBox) newBox.innerHTML = msg;
    } catch (e) {
      const b2 = document.getElementById(boxId);
      if (b2) b2.innerHTML = '<p style="color:#dc2626">خواندن فایل ممکن نشد؛ از «دانلود فایل نمونه» استفاده کنید و همان قالب را پر کنید.</p>';
    }
  });
}

  const STA = { present: "حاضر", absent: "غایب", late: "تأخیر" };
  m.innerHTML = `
    <div class="panel"><h2>حضور و غیاب ${stu ? stu.first_name + " " + stu.last_name : ""} — ${stu ? className(stu.class_id) : ""}</h2>
    ${(rows && rows.length) ? `<table><thead><tr><th>تاریخ</th><th>وضعیت</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td>${faDate(r.attendance_date)}</td><td><span class="badge ${r.status}">${STA[r.status]}</span></td></tr>`).join("")}
      </tbody></table>` : '<p class="muted">هنوز حضور و غیابی ثبت نشده است.</p>'}
    </div>`;
}

/* ---------- Accounts (manager) ---------- */
async function viewAccounts(m) {
  m.innerHTML = '<div class="panel">در حال بارگذاری…</div>';
  const profiles = await get("/profiles?select=id,username,full_name,role,staff_id,student_id&order=role,full_name").catch(() => []);
  const byStaff = {}, byStudentRole = {};
  (profiles || []).forEach(p => {
    if (p.staff_id) byStaff[p.staff_id] = p;
    if (p.student_id) byStudentRole[p.student_id + "|" + p.role] = p;
  });
  const linkName = (p) => {
    if (p.staff_id) { const s = cache.staff.find(x => x.id === p.staff_id); return s ? s.full_name : "—"; }
    if (p.student_id) { return studentName(p.student_id); }
    return "—";
  };
  m.innerHTML = `
    <div class="panel"><h2>حساب‌های موجود (${(profiles || []).length})</h2>
      <table><thead><tr><th>نام</th><th>نام کاربری</th><th>نقش</th><th>وابسته به</th><th>عملیات</th></tr></thead><tbody>
      ${(profiles || []).map(p => `<tr>
        <td>${p.full_name}</td><td dir="ltr" style="text-align:left">${p.username}</td>
        <td><span class="badge role">${ROLE_FA[p.role] || p.role}</span></td><td>${linkName(p)}</td>
        <td>
          <button class="btn small secondary" data-reset="${p.id}">تغییر رمز</button>
          ${p.username !== session.username ? `<button class="btn small secondary" data-del="${p.id}" data-name="${p.full_name}">حذف</button>` : ""}
        </td></tr>`).join("")}
      </tbody></table></div>

    <div class="panel"><h2>ساخت حساب برای معلم‌ها / پرسنل</h2>
      <div class="field" style="max-width:220px"><label>رمز حساب‌های جدید</label><input id="accPassTeacher" value="1234"></div>
      <table><thead><tr><th>نام</th><th>سمت</th><th>نام کاربری</th><th></th></tr></thead><tbody>
      ${cache.staff.length === 0 ? `<tr><td colspan="4" class="muted">هنوز دبیری ثبت نشده است. اول از تب «پرسنل» دبیر را اضافه کنید (یا با فایل اکسل وارد کنید)؛ بعد اینجا در همین فهرست ظاهر می‌شود و برایش حساب می‌سازید.</td></tr>` : ""}
      ${cache.staff.map((s, i) => byStaff[s.id]
        ? `<tr><td>${s.full_name}</td><td>${s.job_title}</td><td colspan="2"><span class="badge role">حساب دارد: ${byStaff[s.id].username}</span></td></tr>`
        : `<tr><td>${s.full_name}</td><td>${s.job_title}</td>
           <td><input id="u-staff-${s.id}" value="t${s.phone ? s.phone.replace(/\D/g, "").slice(-6) : (101 + i)}" dir="ltr" style="padding:7px 9px;border:1px solid #cbd5e1;border-radius:8px"></td>
           <td><button class="btn small" data-create="teacher" data-id="${s.id}">ساخت حساب</button></td></tr>`).join("")}
      </tbody></table></div>

    <div class="panel"><h2>ساخت حساب برای دانش‌آموز و ولی او</h2>
      <div class="field" style="max-width:220px"><label>رمز حساب‌های جدید</label><input id="accPassFam" value="1234"></div>
      <table><thead><tr><th>دانش‌آموز</th><th>کلاس</th><th>حساب دانش‌آموز</th><th>حساب ولی</th></tr></thead><tbody>
      ${cache.students.length === 0 ? `<tr><td colspan="4" class="muted">هنوز دانش‌آموزی ثبت نشده است. اول از تب «دانش‌آموزان» دانش‌آموز را اضافه کنید (یا با فایل اکسل وارد کنید)؛ بعد اینجا برای خودش و ولی‌اش حساب می‌سازید.</td></tr>` : ""}
      ${cache.students.map((s, i) => {
        const sa = byStudentRole[s.id + "|student"];
        const pa = byStudentRole[s.id + "|parent"];
        return `<tr><td>${s.first_name} ${s.last_name}</td><td>${className(s.class_id)}</td>
        <td>${sa ? `<span class="badge role">${sa.username}</span>` : `<span style="display:flex;gap:6px"><input id="u-stu-${s.id}" value="s${101 + i}" dir="ltr" style="padding:7px 9px;border:1px solid #cbd5e1;border-radius:8px;width:90px"><button class="btn small" data-create="student" data-id="${s.id}">ساخت</button></span>`}</td>
        <td>${pa ? `<span class="badge role">${pa.username}</span>` : `<span style="display:flex;gap:6px"><input id="u-par-${s.id}" value="p${s.parent_phone ? s.parent_phone.replace(/\D/g, "").slice(-6) : (201 + i)}" dir="ltr" style="padding:7px 9px;border:1px solid #cbd5e1;border-radius:8px;width:90px"><button class="btn small" data-create="parent" data-id="${s.id}">ساخت</button></span>`}</td></tr>`;
      }).join("")}
      </tbody></table>
      <p class="muted" style="margin-top:8px">نام کاربری‌ها پیشنهاد خودکارند و قبل از ساخت می‌توانید عوضشان کنید. رمز پیش‌فرض را هم می‌توانید برای همه یک رمز بگذارید و بعداً از جدول «حساب‌های موجود» برای هر نفر جدا عوض کنید.</p></div>`;

  m.querySelectorAll("[data-create]").forEach(btn => btn.addEventListener("click", async () => {
    const kind = btn.dataset.create, id = btn.dataset.id;
    let body = null;
    if (kind === "teacher") {
      const s = cache.staff.find(x => x.id === id);
      body = { p_username: val("u-staff-" + id), p_password: val("accPassTeacher") || "1234", p_full_name: s.full_name, p_role: "teacher", p_staff_id: id, p_student_id: null };
    } else if (kind === "student") {
      const s = cache.students.find(x => x.id === id);
      body = { p_username: val("u-stu-" + id), p_password: val("accPassFam") || "1234", p_full_name: s.first_name + " " + s.last_name, p_role: "student", p_staff_id: null, p_student_id: id };
    } else {
      const s = cache.students.find(x => x.id === id);
      body = { p_username: val("u-par-" + id), p_password: val("accPassFam") || "1234", p_full_name: s.parent_name || ("ولی " + s.first_name + " " + s.last_name), p_role: "parent", p_staff_id: null, p_student_id: id };
    }
    if (!body.p_username) { toast("نام کاربری را وارد کنید"); return; }
    btn.disabled = true;
    try { await post("/rpc/create_account", body); toast("حساب ساخته شد: " + body.p_username); render(); }
    catch { toast("ساخت حساب نشد — شاید نام کاربری تکراری است"); btn.disabled = false; }
  }));
  m.querySelectorAll("[data-reset]").forEach(btn => btn.addEventListener("click", async () => {
    const np = prompt("رمز جدید را وارد کنید:");
    if (!np) return;
    try { await api("/rpc/set_account_password", { method: "POST", body: JSON.stringify({ p_id: btn.dataset.reset, p_password: np }) }); toast("رمز عوض شد"); }
    catch { toast("خطا در تغییر رمز"); }
  }));
  m.querySelectorAll("[data-del]").forEach(btn => btn.addEventListener("click", async () => {
    if (!(await askConfirm("حساب «" + btn.dataset.name + "» حذف شود؟"))) return;
    try { await api("/profiles?id=eq." + btn.dataset.del, { method: "DELETE" }); toast("حساب حذف شد"); render(); }
    catch { toast("خطا در حذف"); }
  }));
}

/* ---------- Init ---------- */
(async () => {
  const saved = localStorage.getItem("school_session");
  if (saved) {
    try { session = JSON.parse(saved); await enterApp(); }
    catch { localStorage.removeItem("school_session"); session = null; document.getElementById("appView").classList.add("hidden"); document.getElementById("loginView").classList.remove("hidden"); }
  }
})();
</script>
</body>
</html>
